# ProForm XP 185 U as an under-desk bike, driven by an ESP32.
#
# The bike's original console and handlebars stay intact and unplugged; the
# ESP takes over the 8-pin harness from the base and reproduces what the
# console did:
#   - drives the 6 V magnetic-brake gearmotor through an H-bridge (MOSFET
#     half-bridges, a DRV8833/TB6612 module, or a dual relay board) to one of
#     8 resistance levels, closed loop on the motor's feedback potentiometer
#   - reads cadence from the crank reed switch; tracks ride time and distance
#     on a virtual 27.5" wheel, plus a lifetime odometer kept in flash that
#     unlocks distance milestones (Hadrian's Wall, across Arkansas, ...)
#   - heart rate from a BLE chest strap
#   - a 1.3" OLED + EC11 encoder module (SH1116/EC11, I2C) is the local UI:
#       turn      = resistance level
#       push      = next page (ride / goals / heart rate / brake);  hold = reset ride
#       Back      = drop to level 1 (coast);  Confirm = restore previous level
#
# Drop this file into your ESPHome config dir next to common/ (base.yaml,
# sensor.yaml, fonts/). Fill in the substitutions marked "MEASURE" after the
# calibration steps in README.md.
# ---------------------------------------------------------------------------

substitutions:
  devicename: desk-bike
  upper_devicename: "Desk Bike"
  lcd_width: '128'
  lcd_height: '64'

  # --- Pin map: ESP32 (esp32dev) <-> bike harness + OLED/encoder module -----
  # All safe at boot; ADC on ADC1 (GPIO32-39) so it works alongside Wi-Fi.
  pin_bridge_in1: GPIO18   # H-bridge input 1 (10k pull-down to GND)
  pin_bridge_in2: GPIO19   # H-bridge input 2 (10k pull-down to GND)
  pin_pot: GPIO34          # brake motor feedback pot wiper (pot ends on 3V3 / GND)
  pin_reed: GPIO27         # crank reed switch, other side to GND
  pin_sda: GPIO21          # OLED I2C SDA
  pin_scl: GPIO22          # OLED I2C SCL
  pin_enc_a: GPIO16        # rotary encoder phase A (CLK)
  pin_enc_b: GPIO17        # rotary encoder phase B (DT)
  pin_button: GPIO25       # encoder push-button (PSH)
  pin_back: GPIO26         # "Back" tactile button (BAK / KEY0)
  pin_confirm: GPIO33      # "Confirm" tactile button (CON / KEY1)
  # ESP32-C3 Super Mini alternative (untested; needs logger on USB_SERIAL_JTAG
  # so GPIO20/21 are free): in1 GPIO20, in2 GPIO21, pot GPIO4, reed GPIO5,
  # sda 6, scl 7, enc_a 2, enc_b 0, button 1, back 10, confirm 3.

  # --- bridge type -----------------------------------------------------------
  bridge_active_low: "false"  # "true" for relay boards whose IN pins energise when pulled low

  # --- brake calibration (MEASURE, see README) -------------------------------
  pot_v_level1: "0.40"        # wiper volts at the lightest setting
  pot_v_level8: "2.90"        # wiper volts at the heaviest setting
  in1_raises_pot: "true"      # does energising IN1 make the wiper voltage rise?
  deadband_v: "0.04"          # stop when within this many volts of target
  stall_timeout_ms: "8000"    # give up (and flag a fault) after this long moving

  # --- ride tracking ---------------------------------------------------------
  encoder_resolution: "1"     # 1, 2 or 4: raise it if one detent moves more than one level
  wheel_diameter_in: "27.5"   # virtual tire: 27.5 in -> 2.194 m per wheel turn
  gear_ratio: "2.1"           # wheel turns per crank turn (about 34T x 16T);
                              # 2.1 -> 4.61 m per pedal stroke, 12 mph at 70 rpm
  use_miles: "true"           # OLED and milestone text; HA converts the sensors itself

  # --- heart rate ------------------------------------------------------------
  hrm_mac: "00:00:00:00:00:00"  # BLE strap MAC; ESPHome logs nearby devices at boot

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  name: ${devicename}
  friendly_name: ${upper_devicename}

time:
  - platform: homeassistant
    id: homeassistant_time

<<: !include common/base.yaml
<<: !include common/sensor.yaml

# base.yaml brings wifi/api/ota/logger in via packages:, which deep-merge, so
# this only adds to the wifi block. (The sensor: key below, by contrast,
# replaces common/sensor.yaml's list, so uptime and wifi_signal are repeated
# there.)
wifi:
  fast_connect: true
  power_save_mode: none   # keeps the BLE strap connection stable

esp32_ble_tracker:

ble_client:
  - mac_address: ${hrm_mac}
    id: hrm

switch:
  - platform: restart
    name: "${upper_devicename} Restart"

font:
  - file: 'common/fonts/slkscr.ttf'
    id: font1
    size: 8

  - file: 'common/fonts/BebasNeue-Regular.ttf'
    id: font2
    size: 32

  - file: 'common/fonts/arial.ttf'
    id: font3
    size: 14

# The odometer lives in flash; batch the writes while riding.
preferences:
  flash_write_interval: 5min

globals:
  # --- distance -------------------------------------------------------------
  - id: m_per_rev            # metres travelled per crank revolution
    type: float
    restore_value: no
    initial_value: '${wheel_diameter_in} * 0.0254f * 3.14159265f * ${gear_ratio}'
  - id: odometer_revs        # lifetime crank revolutions (exact; survives reboot)
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: last_crank_total     # pulse_meter total at the previous update
    type: float
    restore_value: no
    initial_value: '0'
  - id: milestones_done      # how many milestones have been announced
    type: int
    restore_value: yes
    initial_value: '0'
  - id: ms_next_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ms_next_km
    type: float
    restore_value: no
    initial_value: '0'
  - id: ms_prev_km
    type: float
    restore_value: no
    initial_value: '0'
  - id: ms_last_name
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: celebrate_until      # millis() until which the OLED shows the banner
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # --- brake loop state ---
  - id: brake_pos            # filtered wiper voltage
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: target_v             # wiper voltage we are driving toward
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: moving
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: move_started
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_dir             # -1, 0, +1 : which bridge leg was last energised
    type: int
    restore_value: no
    initial_value: '0'
  - id: coast_return_level   # level to restore after "Back" (0 = none)
    type: int
    restore_value: no
    initial_value: '0'
  # --- ride state ---
  - id: ride_seconds         # seconds spent pedaling this session
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: session_start_revs   # crank total at the last reset
    type: float
    restore_value: no
    initial_value: '0'

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  frequency: 400kHz

output:
  - platform: gpio
    pin:
      number: ${pin_bridge_in1}
      inverted: ${bridge_active_low}
    id: brake_in1
  - platform: gpio
    pin:
      number: ${pin_bridge_in2}
      inverted: ${bridge_active_low}
    id: brake_in2

sensor:
  - platform: uptime
    name: ${devicename} Uptime
  - platform: wifi_signal
    name: ${devicename} WiFi Signal
    update_interval: 60s

  - platform: rotary_encoder
    name: "${upper_devicename} Encoder"
    id: resistance_dial
    internal: true
    pin_a:
      number: ${pin_enc_a}
      mode: INPUT_PULLUP
    pin_b:
      number: ${pin_enc_b}
      mode: INPUT_PULLUP
    resolution: ${encoder_resolution}
    on_clockwise:
      - number.increment: resistance_level
    on_anticlockwise:
      - number.decrement: resistance_level

  # Raw pot ADC. update_interval: never -> sampled from the brake loop so the
  # log is not flooded with per-sample debug lines.
  - platform: adc
    pin: ${pin_pot}
    id: pot_adc
    attenuation: 12db
    update_interval: never
    internal: true

  # Published copy of the filtered wiper voltage, for calibration/debugging
  - platform: template
    name: "${upper_devicename} Brake Position"
    id: brake_pos_sensor
    unit_of_measurement: V
    accuracy_decimals: 3
    icon: mdi:sine-wave
    entity_category: diagnostic
    update_interval: 1s
    lambda: return id(brake_pos);

  # Cadence: one crank magnet -> pulses per minute == rpm
  - platform: pulse_meter
    name: "${upper_devicename} Cadence"
    id: cadence
    pin:
      number: ${pin_reed}
      mode: INPUT_PULLUP
      inverted: true
    unit_of_measurement: rpm
    icon: mdi:bike
    accuracy_decimals: 0
    internal_filter: 20ms
    timeout: 4s
    total:
      name: "${upper_devicename} Crank Revolutions"
      id: crank_total
      unit_of_measurement: rev
      accuracy_decimals: 0
      icon: mdi:counter
      state_class: total_increasing
      on_value:
        - lambda: |-
            float delta = x - id(last_crank_total);
            id(last_crank_total) = x;
            if (delta > 0 && delta < 1000) id(odometer_revs) += (uint32_t) delta;

  - platform: template
    name: "${upper_devicename} Speed"
    id: speed
    unit_of_measurement: km/h
    device_class: speed
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    lambda: |-
      float rpm = id(cadence).has_state() ? id(cadence).state : 0;
      return rpm * id(m_per_rev) * 60.0f / 1000.0f;

  # Lifetime distance. total_increasing + device_class distance is what HA's
  # utility_meter needs for per-day / week / month / year totals.
  - platform: template
    name: "${upper_devicename} Odometer"
    id: odometer
    unit_of_measurement: km
    device_class: distance
    state_class: total_increasing
    accuracy_decimals: 2
    icon: mdi:counter
    update_interval: 10s
    lambda: return id(odometer_revs) * id(m_per_rev) / 1000.0f;

  - platform: template
    name: "${upper_devicename} Milestone Progress"
    id: milestone_progress
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:flag-checkered
    update_interval: 30s
    lambda: |-
      float km = id(odometer_revs) * id(m_per_rev) / 1000.0f;
      float span = id(ms_next_km) - id(ms_prev_km);
      if (span <= 0) return 100.0f;
      return 100.0f * (km - id(ms_prev_km)) / span;

  - platform: template
    name: "${upper_devicename} Ride Time"
    id: ride_time
    unit_of_measurement: min
    accuracy_decimals: 1
    icon: mdi:timer-outline
    update_interval: 5s
    lambda: return id(ride_seconds) / 60.0f;

  - platform: template
    name: "${upper_devicename} Ride Distance"
    id: ride_distance
    unit_of_measurement: km
    device_class: distance
    accuracy_decimals: 2
    icon: mdi:map-marker-distance
    update_interval: 5s
    lambda: |-
      if (!id(crank_total).has_state()) return 0.0f;
      float revs = id(crank_total).state - id(session_start_revs);
      if (revs < 0) revs = 0;
      return revs * id(m_per_rev) / 1000.0f;

  # BLE chest strap (standard Heart Rate Service)
  - platform: ble_client
    type: characteristic
    ble_client_id: hrm
    name: "${upper_devicename} Heart Rate"
    id: heart_rate
    service_uuid: '180d'
    characteristic_uuid: '2a37'
    notify: true
    update_interval: never
    unit_of_measurement: bpm
    accuracy_decimals: 0
    icon: mdi:heart-pulse
    lambda: |-
      if (x.size() < 2) return NAN;
      uint16_t hr = x[1];
      if ((x[0] & 1) && x.size() >= 3) hr |= (x[2] << 8);   // flag bit 0: 16-bit value
      return hr > 0 ? (float) hr : NAN;

text_sensor:
  - platform: template
    name: "${upper_devicename} Last Milestone"
    id: last_milestone
    icon: mdi:trophy
    update_interval: never
  - platform: template
    name: "${upper_devicename} Next Milestone"
    id: next_milestone
    icon: mdi:flag-checkered
    update_interval: never

script:
  # Fired once per milestone: HA event for automations (TTS, lights, ...) and
  # a 15 s banner on the OLED.
  - id: announce_milestone
    then:
      - homeassistant.event:
          event: esphome.desk_bike_milestone
          data:
            title: !lambda 'return id(ms_last_name);'
            odometer_km: !lambda 'return to_string(id(odometer_revs) * id(m_per_rev) / 1000.0f);'
      - lambda: id(celebrate_until) = millis() + 15000;
      - display.page.show: page_goals
      - component.update: oled

number:
  - platform: template
    name: "${upper_devicename} Resistance Level"
    id: resistance_level
    icon: mdi:speedometer
    min_value: 1
    max_value: 8
    step: 1
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 1
    on_value:
      - lambda: |-
          const float v1 = ${pot_v_level1};
          const float v8 = ${pot_v_level8};
          float level = x < 1 ? 1 : (x > 8 ? 8 : x);
          id(target_v) = v1 + (level - 1.0f) * (v8 - v1) / 7.0f;
          id(motor_fault).publish_state(false);
          id(move_started) = millis();
          id(moving) = true;
          ESP_LOGI("brake", "Level %.0f -> target %.3f V", level, id(target_v));
      - component.update: oled

binary_sensor:
  - platform: template
    name: "${upper_devicename} Brake Motor Fault"
    id: motor_fault
    device_class: problem
    entity_category: diagnostic

  - platform: template
    name: "${upper_devicename} Brake Moving"
    device_class: moving
    entity_category: diagnostic
    lambda: return id(moving);

  - platform: template
    name: "${upper_devicename} Pedaling"
    device_class: motion
    lambda: return id(cadence).has_state() && id(cadence).state > 0;

  # Encoder push: short click = next page, long press = reset ride
  - platform: gpio
    pin:
      number: ${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    name: "${upper_devicename} Button"
    on_multi_click:
    - timing:
      - ON for 1.1s to 3s
      - OFF for at least 0.1s
      then:
        - logger.log: "long press - reset ride"
        - button.press: reset_ride
    - timing:
      - ON for at most 1s
      - OFF for at least 0.2s
      then:
        - display.page.show_next: oled
        - component.update: oled

  # "Back" -> drop to level 1 (coast), remembering where we were
  - platform: gpio
    pin:
      number: ${pin_back}
      mode: INPUT_PULLUP
      inverted: true
    name: "${upper_devicename} Back"
    on_press:
      - lambda: |-
          int cur = (int) id(resistance_level).state;
          if (cur > 1) id(coast_return_level) = cur;
      - number.set:
          id: resistance_level
          value: 1

  # "Confirm" -> restore the level we coasted from
  - platform: gpio
    pin:
      number: ${pin_confirm}
      mode: INPUT_PULLUP
      inverted: true
    name: "${upper_devicename} Confirm"
    on_press:
      - if:
          condition:
            lambda: return id(coast_return_level) > 0;
          then:
            - number.set:
                id: resistance_level
                value: !lambda return id(coast_return_level);

button:
  - platform: template
    name: "${upper_devicename} Reset Ride"
    id: reset_ride
    icon: mdi:restart
    on_press:
      - lambda: |-
          id(ride_seconds) = 0;
          id(session_start_revs) = id(crank_total).has_state() ? id(crank_total).state : 0;
      - component.update: ride_time
      - component.update: ride_distance
      - display.page.show: page_ride
      - component.update: oled

  # Calibration helpers: nudge the motor 250 ms on one bridge leg and stop.
  - platform: template
    name: "${upper_devicename} Brake Jog IN1"
    icon: mdi:arrow-right-bold
    entity_category: config
    on_press:
      - lambda: |-
          id(moving) = false;
          id(last_dir) = 0;
      - output.turn_off: brake_in2
      - output.turn_on: brake_in1
      - delay: 250ms
      - output.turn_off: brake_in1

  - platform: template
    name: "${upper_devicename} Brake Jog IN2"
    icon: mdi:arrow-left-bold
    entity_category: config
    on_press:
      - lambda: |-
          id(moving) = false;
          id(last_dir) = 0;
      - output.turn_off: brake_in1
      - output.turn_on: brake_in2
      - delay: 250ms
      - output.turn_off: brake_in2

  - platform: template
    name: "${upper_devicename} Brake Stop"
    icon: mdi:stop
    entity_category: config
    on_press:
      - lambda: |-
          id(moving) = false;
          id(last_dir) = 0;
      - output.turn_off: brake_in1
      - output.turn_off: brake_in2

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"     # SH1116 works with the SH1106 driver; if the
    address: 0x3C              # image is shifted 2 px try "SSD1306 128x64"
    update_interval: 500ms
    id: oled
    pages:
      # --- Page 1: ride -------------------------------------------------
      - id: page_ride
        lambda: |-
          float rpm = id(cadence).has_state() ? id(cadence).state : 0;
          uint32_t s = id(ride_seconds);

          // Row 1: level (left) / rpm (right)
          it.printf(0, 0, id(font3), TextAlign::TOP_LEFT, "LVL %d",
                    (int) id(resistance_level).state);
          it.printf(127, 0, id(font3), TextAlign::TOP_RIGHT, "%.0f rpm", rpm);

          // Row 2: ride clock, big
          it.printf(64, 16, id(font2), TextAlign::TOP_CENTER, "%02u:%02u", s / 60, s % 60);
          if (id(moving)) it.print(127, 24, id(font1), TextAlign::TOP_RIGHT, "MOT");

          // Row 3: distance (left) / heart rate (right) / clock (middle)
          const bool mi = ${use_miles};
          it.printf(0, 63, id(font1), TextAlign::BASELINE_LEFT, "%.2f %s",
                    id(ride_distance).state * (mi ? 0.621371f : 1.0f), mi ? "MI" : "KM");
          if (id(homeassistant_time).now().is_valid())
            it.strftime(64, 63, id(font1), TextAlign::BASELINE_CENTER, "%H:%M",
                        id(homeassistant_time).now());
          if (id(heart_rate).has_state() && !isnan(id(heart_rate).state))
            it.printf(127, 63, id(font1), TextAlign::BASELINE_RIGHT, "%.0f BPM",
                      id(heart_rate).state);
          else
            it.print(127, 63, id(font1), TextAlign::BASELINE_RIGHT, "-- BPM");

      # --- Page 2: goals (odometer + next milestone) --------------------
      - id: page_goals
        lambda: |-
          const bool mi = ${use_miles};
          const float k = mi ? 0.621371f : 1.0f;
          const char *u = mi ? "mi" : "km";
          float km = id(odometer_revs) * id(m_per_rev) / 1000.0f;
          if (millis() < id(celebrate_until)) {
            it.print(64, 0, id(font3), TextAlign::TOP_CENTER, "MILESTONE!");
            it.printf(64, 22, id(font3), TextAlign::TOP_CENTER, "%s", id(ms_last_name).c_str());
            it.printf(64, 63, id(font1), TextAlign::BASELINE_CENTER, "%.1f %s TOTAL", km * k, mi ? "MI" : "KM");
            return;
          }
          it.printf(0, 0, id(font3), TextAlign::TOP_LEFT, "%.1f %s", km * k, u);
          it.print(127, 4, id(font1), TextAlign::TOP_RIGHT, "ODOMETER");
          it.print(0, 20, id(font1), TextAlign::TOP_LEFT, "NEXT");
          it.printf(0, 30, id(font3), TextAlign::TOP_LEFT, "%s", id(ms_next_name).c_str());
          float span = id(ms_next_km) - id(ms_prev_km);
          float frac = span > 0 ? (km - id(ms_prev_km)) / span : 1.0f;
          if (frac < 0) frac = 0;
          if (frac > 1) frac = 1;
          it.rectangle(0, 48, 128, 7);
          it.filled_rectangle(0, 48, (int) (128 * frac), 7);
          it.printf(127, 63, id(font1), TextAlign::BASELINE_RIGHT, "%.1f %s TO GO",
                    (id(ms_next_km) - km) * k, mi ? "MI" : "KM");

      # --- Page 3: heart rate -------------------------------------------
      - id: page_hr
        lambda: |-
          it.print(0, 0, id(font3), TextAlign::TOP_LEFT, "Heart rate");
          if (id(heart_rate).has_state() && !isnan(id(heart_rate).state))
            it.printf(64, 16, id(font2), TextAlign::TOP_CENTER, "%.0f",
                      id(heart_rate).state);
          else
            it.print(64, 16, id(font2), TextAlign::TOP_CENTER, "--");
          it.print(64, 63, id(font1), TextAlign::BASELINE_CENTER,
                   id(hrm).connected() ? "STRAP CONNECTED" : "STRAP NOT FOUND");

      # --- Page 4: brake diagnostics (calibration helper) ---------------
      - id: page_brake
        lambda: |-
          it.print(0, 0, id(font3), TextAlign::TOP_LEFT, "Brake");
          it.printf(0, 20, id(font3), TextAlign::TOP_LEFT, "pos  %.3f V", id(brake_pos));
          it.printf(0, 36, id(font3), TextAlign::TOP_LEFT, "tgt  %.3f V", id(target_v));
          it.printf(0, 63, id(font1), TextAlign::BASELINE_LEFT, "LVL %d  %s",
                    (int) id(resistance_level).state, id(moving) ? "MOVING" : "IDLE");
          if (id(motor_fault).state)
            it.print(127, 63, id(font1), TextAlign::BASELINE_RIGHT, "FAULT");

interval:
  # Ride clock: count seconds while pedaling.
  - interval: 1s
    then:
      - lambda: |-
          if (id(cadence).has_state() && id(cadence).state > 0) id(ride_seconds)++;

  # Milestones, by lifetime distance. Names are kept short enough for one OLED
  # line. Add your own: keep the list sorted by distance.
  - interval: 5s
    then:
      - lambda: |-
          struct Milestone { float km; const char *name; };
          static const Milestone M[] = {
            {    21.6f, "Length of Manhattan"},       // 13.4 mi
            {    33.3f, "English Channel"},           // Dover-Calais, 20.7 mi
            {    38.4f, "Pontchartrain Cswy"},        // 23.8 mi
            {    42.2f, "A marathon"},
            {    82.0f, "Panama Canal"},
            {   117.5f, "Hadrian's Wall"},            // 73 mi
            {   160.9f, "A century ride"},            // 100 mi
            {   386.0f, "Katy Trail"},                // 240 mi
            {   446.0f, "Grand Canyon"},              // 277 mi end to end
            {   458.0f, "Across Arkansas"},           // I-40, 285 mi
            {   715.0f, "Natchez Trace"},             // 444 mi
            {  1056.0f, "Pacific Coast Hwy"},         // CA-1, 656 mi
            {  1407.0f, "Land's End-J o'Groats"},     // 874 mi
            {  3400.0f, "A Tour de France"},
            {  3537.0f, "Appalachian Trail"},         // 2,198 mi
            {  3940.0f, "Route 66"},                  // 2,448 mi
            {  4490.0f, "New York to LA"},
            {  8850.0f, "Great Wall (Ming)"},
            { 40075.0f, "Around the Earth"},
          };
          const int N = sizeof(M) / sizeof(M[0]);
          const bool mi = ${use_miles};
          float km = id(odometer_revs) * id(m_per_rev) / 1000.0f;

          int done = 0;
          while (done < N && km >= M[done].km) done++;

          if (done > id(milestones_done)) {
            id(milestones_done) = done;
