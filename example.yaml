# Example ESPHome device config for the vivo_desk component (ESP32-C3).
#
# Relay mode (default) gives Home Assistant live height + Up/Down/preset control
# while keeping the physical handset fully working (display, buttons, holds).
#
# WIRING (ESP32-C3, series-cut handset<->brain RJ45 data lines, 19200 8N1):
#   GPIO4 <- Handset TX     GPIO5 -> Handset RX     (hand_uart)
#   GPIO6 <- Brain TX       GPIO7 -> Brain RX        (brain_uart)
#   Desk GND -> ESP GND via a ~100 ohm series resistor (see README grounding tip).
# The ESP32-C3 is NOT 5V tolerant; level-shift the data lines if your desk is 5V.
#
# Provide wifi_ssid / wifi_password / api_key / ota_password in your secrets.yaml.

substitutions:
  name: vivo-desk
  friendly_name: "VIVO Desk"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Log over native USB so both hardware UARTs stay free for the desk.
logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# Optional: web UI for direct control / diagnostics
web_server:

external_components:
  - source: github://moellere/esphome-vivo-desk
    components: [ vivo_desk ]

uart:
  - id: hand_uart
    rx_pin: GPIO4
    tx_pin: GPIO5
    baud_rate: 19200
  - id: brain_uart
    rx_pin: GPIO6
    tx_pin: GPIO7
    baud_rate: 19200

vivo_desk:
  id: desk
  hand_uart: hand_uart
  brain_uart: brain_uart
  height:
    name: "Desk Height"

switch:
  - platform: template
    name: "Desk Up"
    id: desk_up
    optimistic: true
    turn_on_action:
      - lambda: id(desk).start_up();
    turn_off_action:
      - lambda: id(desk).stop();

  - platform: template
    name: "Desk Down"
    id: desk_down
    optimistic: true
    turn_on_action:
      - lambda: id(desk).start_down();
    turn_off_action:
      - lambda: id(desk).stop();

  # DEFAULT MODE: relay ON -> handset fully functional AND HA can read + inject.
  - platform: template
    name: "Desk Relay"
    id: desk_relay
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: id(desk).set_relay(true);
    turn_off_action:
      - lambda: id(desk).set_relay(false);

  # Emulate the handset toward the brain (use when no physical handset is present).
  - platform: template
    name: "Desk Emulate Handset"
    id: desk_emulate
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(desk).set_emulate(true);
    turn_off_action:
      - lambda: id(desk).set_emulate(false);

  # Diagnostics (bring-up only)
  - platform: template
    name: "Desk Verbose Log"
    id: desk_verbose
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(desk).set_verbose(true);
    turn_off_action:
      - lambda: id(desk).set_verbose(false);

  - platform: template
    name: "Desk Silent Listen"
    id: desk_silent
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(desk).set_silent(true);
    turn_off_action:
      - lambda: id(desk).set_silent(false);

button:
  - platform: template
    name: "Desk M1"
    on_press:
      lambda: id(desk).goto_preset(1);
  - platform: template
    name: "Desk M2"
    on_press:
      lambda: id(desk).goto_preset(2);
  - platform: template
    name: "Desk M3"
    on_press:
      lambda: id(desk).goto_preset(3);
  - platform: template
    name: "Desk M4"
    on_press:
      lambda: id(desk).goto_preset(4);
  - platform: template
    name: "Desk Stop"
    on_press:
      lambda: id(desk).stop();
